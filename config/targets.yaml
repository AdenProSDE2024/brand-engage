topics:
  - why: "AI agents in real operations, not demo threads."
    enabled: true
    query: '("AI agent" OR "AI agents") (workflow OR operations OR "back office") -is:retweet -is:reply lang:en'

  - why: "PE and portfolio-company operations."
    enabled: true
    query: '("private equity" OR "portfolio company" OR "operating partner") (AI OR automation OR operations) -is:retweet -is:reply lang:en'

  - why: "Desk-heavy work where a pilot usually misses the exceptions."
    enabled: true
    query: '(BPO OR underwriting OR "claims processing" OR staffing) (AI OR automation OR workflow) -is:retweet -is:reply lang:en'

