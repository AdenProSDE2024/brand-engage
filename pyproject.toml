[project]
name = "brand-engage"
version = "0.1.0"
description = "Draft-only daily X and LinkedIn engagement digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
brand-engage = "brand_engage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brand_engage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
