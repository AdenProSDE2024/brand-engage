name: Daily brand engage

on:
  schedule:
    # 14:30 UTC is 6:30am Pacific Standard Time and 7:30am Pacific Daylight Time.
    # GitHub cron is UTC only, so this matches standard time and runs an hour
    # later during daylight time.
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use fixture data and do not call X, the LLM, or Slack"
        required: false
        default: false
        type: boolean

# The job that builds the digest cannot push. A public repo's Actions log is
# public too, so the script also refuses to print drafts unless commit_digest
# is true. The publish job below is the only writer, and it stays skipped
# while commit_digest is false.
permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit_digest: ${{ steps.flags.outputs.commit_digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Read commit flag
        id: flags
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          cfg = yaml.safe_load(open("config/settings.yaml"))
          flag = "true" if cfg.get("commit_digest") else "false"
          print(f"commit_digest={flag}")
          PY

      - name: Run
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m brand_engage --dry-run
          else
            python -m brand_engage
          fi

      - name: Upload digest for publish
        if: steps.flags.outputs.commit_digest == 'true' && github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brand-engage-digest
          path: |
            digests/
            log.csv
          if-no-files-found: error

  publish:
    needs: digest
    if: needs.digest.outputs.commit_digest == 'true' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: brand-engage-digest
          path: _artifact

      - name: Commit digest
        run: |
          mkdir -p digests
          cp -f _artifact/digests/*.md digests/ 2>/dev/null || cp -f _artifact/*.md digests/ || true
          if [ -f _artifact/log.csv ]; then
            cp -f _artifact/log.csv log.csv
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f digests/*.md log.csv
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
            exit 0
          fi
          git commit -m "Add daily brand-engage digest"
          git push
